services:
  nginx:
    image: nginx:alpine
    container_name: copyright-nginx
    ports:
      - "80:80"
    volumes:
      # 挂载 nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载静态资源目录，让 nginx 直接响应 /static/ 请求
      - ./static:/usr/share/nginx/html/static:ro
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的 Flask (端口5000)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
