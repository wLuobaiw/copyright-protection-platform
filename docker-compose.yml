services:
  app:
    build: .
    container_name: copyright-app
    ports:
      - "80:80"
    volumes:
      # nginx 配置，只读
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 静态文件：nginx 直接响应 /static/ 请求（只读）
      - ./static:/usr/share/nginx/html/static:ro
      # 项目代码挂载到 /app，Flask 工作目录
      # data/ 和 static/uploads/ 需要可写，由该挂载提供
      - ./:/app
    restart: unless-stopped
